version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: akotav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123qwe123
      POSTGRES_DB: akotav
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d akotav"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: akotav-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123qwe123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO client to create bucket on startup
  minio-mc:
    image: minio/mc:latest
    container_name: akotav-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin 123qwe123;
      /usr/bin/mc mb myminio/akotav --ignore-existing;
      /usr/bin/mc anonymous set download myminio/akotav;
      exit 0;
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
